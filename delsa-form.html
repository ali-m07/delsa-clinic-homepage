.delsa-form-page,
.delsa-form-page * {
  box-sizing: border-box;
  font-family: "Vazirmatn", Tahoma, sans-serif;
}

.delsa-form-page {
  --navy: #0F2740;
  --navy-deep: #0A1B2E;
  --teal: #1FA8A0;
  --teal-deep: #178F88;
  --sand: #F3F5F7;
  --muted: #5B6B7C;
  --line: rgba(15, 39, 64, 0.12);
  --header-h: 64px;
  --radius: 16px;
  --radius-sm: 12px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  position: relative;
  width: 100vw;
  max-width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  min-height: calc(100dvh - var(--header-h));
  min-height: calc(100svh - var(--header-h));
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  color: var(--navy);
  background: var(--sand);
  direction: rtl;
  text-align: right;
  -webkit-font-smoothing: antialiased;
}
@media (min-width: 1024px) {
  .delsa-form-page { --header-h: 72px; }
  .delsa-form-page {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    min-height: calc(100dvh - var(--header-h));
    min-height: calc(100svh - var(--header-h));
  }
}

@media (min-width: 1024px) {

}

.delsa-form-page .df-hero__lead {

<script>
(function () {
  var GF_FORM_ID = 1;

  function reorderProvinceCityFields() {
    var form = document.querySelector(".delsa-form-page .gform_fields") || document.querySelector(".gform_fields");
    if (!form) return;
    var fields = Array.prototype.slice.call(form.querySelectorAll(":scope > .gfield"));
    function findField(keyword) {
      return fields.find(function (field) {
        var label = field.querySelector(".gfield_label, .gform-field-label");
        if (!label) return false;
        return label.textContent.replace(/\*/g, "").trim().indexOf(keyword) !== -1;
      });
    }
    var province = findField("استان");
    var city = findField("شهر");
    if (province && city && (province.compareDocumentPosition(city) & Node.DOCUMENT_POSITION_PRECEDING)) {
      form.insertBefore(province, city);
    }
    form.querySelectorAll(".ginput_container_address").forEach(function (container) {
      var state = container.querySelector(".ginput_address_state");
      var cityEl = container.querySelector(".ginput_address_city");
      if (state && cityEl && (state.compareDocumentPosition(cityEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
        container.insertBefore(state, cityEl);
      }
    });
  }

  function init() {
    reorderProvinceCityFields();
    if (typeof jQuery === "undefined") return;
    var $ = jQuery;
    $("#gform_" + GF_FORM_ID).find("select").filter(function () {
      var label = $(this).closest(".gfield").find("label").first().text() || "";
      return label.indexOf("استان") !== -1;
    }).first().off("change.dfCity").on("change.dfCity", reorderProvinceCityFields);
  }

  if (typeof jQuery !== "undefined") {
    jQuery(document).on("gform_post_render", function (e, formId) {
      if (Number(formId) === GF_FORM_ID) init();
    });
    jQuery(function () {
      [0, 300, 800].forEach(function (ms) { setTimeout(init, ms); });
    });
  } else {
    document.addEventListener("DOMContentLoaded", function () {
      [0, 300, 800].forEach(function (ms) { setTimeout(init, ms); });
    });
  }
})();
</script>
