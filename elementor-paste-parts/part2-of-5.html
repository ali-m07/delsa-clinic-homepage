<!-- DELSA part 2/5 — ویجت HTML #2 -->
<!-- هر ویجت: بلوک‌های CSS کامل و بسته — Elementor هر ویجت را جدا wrap می‌کند -->
<!-- CSS ادامه: چرا دلسا + فضا + CTA + مراحل + FAQ + شناورها -->
<style id="delsa-home-css-2">
    /* Why */
    .why-grid { display: grid; gap: .75rem; }
    @media (min-width: 800px) { .why-grid { grid-template-columns: repeat(3, 1fr); } }
    .why-card {
      padding: 1rem 1.05rem; border-radius: 18px; background: #FFFCFA;
      border: 1px solid rgba(27,58,75,.08);
    }
    .why-card__icon {
      width: 36px; height: 36px; border-radius: 11px; margin-bottom: .6rem;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(196,132,106,.16); color: var(--terracotta);
    }
    .why-card h3 { margin: 0 0 .3rem; font-size: 1rem; font-weight: 750; }
    .why-card p { margin: 0; font-size: 13.5px; color: var(--muted); }
    .quote {
      margin: 1rem 0 0; padding: 1.15rem 1.25rem; border-radius: 18px;
      background: linear-gradient(120deg, #FBF8F3, #F0F7F6);
      border: 1px solid rgba(58,143,138,.18);
    }
    .quote p {
      margin: 0 0 .55rem; font-size: clamp(1rem, .92rem + .4vw, 1.2rem);
      font-weight: 550; line-height: 1.75;
    }
    .quote figcaption { font-size: 12.5px; color: var(--muted); }

    /* Space */
    .space-mosaic { display: grid; gap: .55rem; grid-template-columns: 1fr 1fr; }
    @media (min-width: 800px) {
      .space-mosaic {
        grid-template-columns: 1.55fr 1fr 1fr;
        grid-template-rows: 190px 190px;
      }
      .space-mosaic__main { grid-row: span 2; }
    }
    .space-mosaic figure {
      margin: 0; overflow: hidden; border-radius: 16px; min-height: 140px;
    }
    .space-mosaic img { width: 100%; height: 100%; object-fit: cover; }

    /* CTA band */
    .cta-band {
      padding: 1.25rem 0;
      background: linear-gradient(115deg, #3A8F8A, #4FA39D); color: #fff;
    }
    .cta-band__inner {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: .85rem 1.25rem;
    }
    .cta-band__copy { margin: 0; font-size: 1.05rem; font-weight: 650; }
    .cta-band__copy span {
      display: block; margin-top: .2rem; font-size: 13.5px;
      font-weight: 450; color: rgba(255,255,255,.72);
    }

    /* Steps */
    .steps { display: grid; gap: .7rem; }
    @media (min-width: 800px) { .steps { grid-template-columns: repeat(3, 1fr); gap: 1.25rem; } }
    .step {
      padding: 1.1rem 1rem; border-radius: 18px; background: #FFFCFA;
      border: 1px solid rgba(27,58,75,.08); text-align: center;
    }
    .step__num {
      display: inline-flex; width: 42px; height: 42px; align-items: center; justify-content: center;
      border-radius: 50%; background: var(--navy); color: #fff; font-weight: 800; margin-bottom: .7rem;
      box-shadow: 0 0 0 6px rgba(58,143,138,.14);
    }
    .step h3 { margin: 0 0 .3rem; font-size: 1rem; font-weight: 750; }
    .step p { margin: 0; font-size: 13.5px; color: var(--muted); }

    /* FAQ */
    .faq { display: grid; gap: .5rem; }
    .faq details {
      border: 1px solid rgba(27,58,75,.1); border-radius: 14px;
      background: linear-gradient(160deg, #F7F1E8, #F0E7DB); overflow: hidden;
    }
    .faq summary {
      cursor: pointer; list-style: none; padding: .85rem 1rem;
      font-weight: 650; font-size: 14.5px;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .faq summary::-webkit-details-marker { display: none; }
    .faq summary::after {
      content: "+"; width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(58,143,138,.1); color: var(--teal-deep); flex: 0 0 auto;
    }
    .faq details[open] summary::after { content: "–"; }
    .faq__body { padding: 0 1rem 1rem; color: var(--muted); font-size: 14px; }
    .faq__body p { margin: 0; }

    /* Floats */
    .whatsapp-float {
      position: fixed; left: 1rem; bottom: 1rem; z-index: 9000;
      width: 54px; height: 54px; border-radius: 50%;
      background: #25D366; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 28px rgba(37,211,102,.35);
    }
    .mobile-cta {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8990;
      display: flex; background: #FFFCFA;
      border-top: 1px solid rgba(36,59,72,.1);
      transform: translateY(110%); transition: transform .3s var(--ease);
    }
    .mobile-cta.visible { transform: none; }
    .mobile-cta a {
      flex: 1; text-align: center; padding: .95rem; font-weight: 700; font-size: 14px;
    }
    .mobile-cta__call { color: var(--navy); border-left: 1px solid rgba(36,59,72,.1); }
    .mobile-cta__book { background: var(--teal); color: #fff; }
    @media (min-width: 1024px) { .mobile-cta { display: none; } }

    [data-reveal] {
      opacity: 0; transform: translateY(24px);
      transition: opacity .85s var(--ease), transform .85s var(--ease);
    }
    [data-reveal].is-in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      [data-reveal] { opacity: 1; transform: none; transition: none; }
    }</style>
