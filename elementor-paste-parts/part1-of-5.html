<!-- DELSA part 1/5 — ویجت HTML #1 -->
<!-- هر ویجت: بلوک‌های CSS کامل و بسته — Elementor هر ویجت را جدا wrap می‌کند -->
<!-- CSS پایه: توکن‌ها + هیرو + آمار + خدمات -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="delsa-home-css-1">
:root {
      --navy: #243B48;
      --navy-deep: #1A2F3A;
      --teal: #3A8F8A;
      --teal-deep: #2F7571;
      --muted: #5E6F7A;
      --cream: #FBF8F3;
      --cream-2: #F5F1EA;
      --terracotta: #C4846A;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font: "Vazirmatn", Tahoma, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    .delsa-home {
      font-family: var(--font);
      color: var(--navy);
      background: linear-gradient(180deg, #FBF8F3 0%, #F7F3EC 100%);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      text-align: right;
      direction: rtl;
    }
    .delsa-home *, .delsa-home *::before, .delsa-home *::after { box-sizing: border-box; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    ul, ol { margin: 0; padding: 0; list-style: none; }
    .wrap {
      width: min(1140px, calc(100% - clamp(2rem, 6vw, 4.5rem)));
      margin-inline: auto;
    }
    .wrap--narrow { width: min(720px, calc(100% - clamp(2rem, 6vw, 4.5rem))); }
    .dir-ltr { direction: ltr; display: inline-block; unicode-bidi: embed; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .88rem 1.55rem; border-radius: 999px;
      font-size: 14px; font-weight: 700; font-family: inherit; border: 0;
      transition: transform .22s var(--ease), box-shadow .25s, background .25s, border-color .25s;
    }
    .btn--primary {
      background: var(--teal); color: #fff;
      box-shadow: 0 12px 36px rgba(58,143,138,.28);
    }
    .btn--primary:hover { background: var(--teal-deep); transform: scale(1.04); }
    .btn--ghost {
      color: #fff; border: 1px solid rgba(255,255,255,.5);
      background: rgba(255,255,255,.1);
    }
    .btn--ghost:hover { background: rgba(255,255,255,.2); transform: scale(1.04); }
    .btn--on-teal { background: #fff; color: var(--navy-deep); box-shadow: none; }
    .btn--on-teal:hover { background: #F7F1E8; }


    /* Hero */
    .hero {
      position: relative;
      margin-top: 0;
      min-height: min(92svh, 760px);
      display: flex; align-items: flex-end;
      padding: 2.5rem 0 3.5rem;
      overflow: hidden; color: #fff;
    }
    @media (min-width: 768px) {
      .hero { min-height: min(88vh, 820px); padding-bottom: 4.25rem; }
    }
    .hero__media { position: absolute; inset: 0; overflow: hidden; }
    .hero__reel { position: absolute; inset: -4% 0; will-change: transform; }
    .hero__photo {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center 38%; opacity: 0;
    }
    .hero__photo.is-active { opacity: 1; z-index: 1; }
    .hero__photo.is-leaving { z-index: 2; }
    .hero__mesh {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 85% 15%, rgba(194,164,107,.22), transparent 55%),
        radial-gradient(ellipse 55% 50% at 10% 80%, rgba(58,143,138,.18), transparent 55%);
      mix-blend-mode: soft-light;
    }
    .hero__veil {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background:
        linear-gradient(90deg, rgba(16,32,40,.12) 0%, rgba(16,32,40,.28) 42%, rgba(16,32,40,.72) 100%),
        linear-gradient(180deg, rgba(16,32,40,.18) 0%, transparent 28%, rgba(16,32,40,.55) 100%);
    }
    .hero__shine {
      position: absolute; inset: 0; z-index: 4; pointer-events: none;
      background: linear-gradient(115deg, transparent 28%, rgba(255,255,255,.14) 48%, transparent 64%);
    }
    .hero__inner {
      position: relative; z-index: 5;
      width: min(1140px, calc(100% - clamp(2rem, 6vw, 4.5rem)));
      margin-inline: auto;
    }
    .hero__copy {
      max-width: 36rem; position: relative; z-index: 6;
      text-shadow: 0 10px 36px rgba(8,18,24,.35);
    }
    @media (max-width: 767px) {
      .hero { min-height: 88svh; padding-bottom: 3.75rem; }
      .hero__actions .btn { flex: 1 1 auto; min-height: 2.75rem; }
    }
    .hero__brand {
      margin: 0 0 .55rem;
      font-size: clamp(2.35rem, 1.55rem + 3.2vw, 3.55rem);
      font-weight: 800; letter-spacing: -.045em; line-height: 1.02;
    }
    .hero__title {
      margin: 0 0 .75rem;
      font-size: clamp(1.15rem, 1rem + .85vw, 1.55rem);
      font-weight: 500; letter-spacing: -.02em; line-height: 1.4;
      max-width: 18ch; color: rgba(255,255,255,.94);
    }
    .hero__lead {
      margin: 0 0 1.2rem; max-width: 32rem;
      font-size: 1rem; line-height: 1.85; color: rgba(255,255,255,.86);
    }
    .hero__actions { display: flex; flex-wrap: wrap; gap: .7rem; }
    .hero__dots {
      position: absolute; z-index: 6; left: 50%; bottom: 1.15rem;
      transform: translateX(-50%); display: flex; gap: .45rem; opacity: 0;
    }
    .hero__dots.is-ready { opacity: 1; }
    .hero__dot {
      width: 22px; height: 8px; border-radius: 999px; border: 0; padding: 0;
      background: rgba(255,255,255,.35); cursor: pointer;
      transform: scaleX(.42); transform-origin: center;
      transition: transform .4s var(--ease), background .35s;
    }
    .hero__dot.is-active { background: #fff; transform: scaleX(1); }

    /* Trust */
    .trust {
      padding: 1.35rem 0 1.1rem;
      border-bottom: 1px solid rgba(36,59,72,.08);
      background: linear-gradient(180deg, #F8F4EE 0%, #FBF8F3 100%);
    }
    .trust__inner {
      display: grid; gap: 1rem; grid-template-columns: 1fr;
    }
    @media (min-width: 700px) {
      .trust__inner { grid-template-columns: repeat(3, 1fr); gap: 0; }
      .trust__inner > li + li { border-right: 1px solid rgba(36,59,72,.1); }
    }
    .trust__inner > li { padding: .35rem 1rem; text-align: center; }
    .trust__inner strong {
      display: block; font-size: clamp(1.65rem, 1.35rem + 1vw, 2.1rem);
      font-weight: 800; letter-spacing: -.03em; line-height: 1.1;
    }
    .trust__inner span {
      display: block; margin-top: .25rem; font-size: .9rem; color: rgba(26,47,58,.72);
    }

    /* Sections */
    .section { padding: 2rem 0; }
    .section--warm { background: #F8F4ED; }
    .section--soft {
      background: linear-gradient(180deg, rgba(58,143,138,.05), transparent), #F5F1EA;
    }
    .section__head { margin-bottom: 1.1rem; max-width: 40rem; }
    .section__head--center { text-align: center; margin-inline: auto; }
    .section__head h2 {
      margin: 0; font-size: clamp(1.4rem, 1.15rem + 1vw, 1.95rem);
      font-weight: 800; letter-spacing: -.03em; line-height: 1.25;
    }
    .section__head p { margin: .4rem 0 0; color: var(--muted); font-size: 14.5px; }

    /* Services */
    .services-grid {
      display: grid; gap: .85rem; grid-template-columns: 1fr;
    }
    @media (min-width: 640px) { .services-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (min-width: 980px) { .services-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
    .tile {
      display: flex; flex-direction: column; border-radius: 22px; overflow: hidden;
      background: #FFFCFA; border: 1px solid rgba(36,59,72,.08);
      box-shadow: 0 14px 36px rgba(19,42,55,.08);
      transition: transform .35s var(--ease), box-shadow .35s, border-color .35s;
    }
    .tile:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 22px 50px rgba(19,42,55,.12);
      border-color: rgba(58,143,138,.28);
    }
    .tile__media { position: relative; aspect-ratio: 16/11; overflow: hidden; background: #ddd5c8; }
    .tile__media img {
      width: 100%; height: 100%; object-fit: cover;
      transform: scale(1.03); transition: transform .8s var(--ease);
    }
    .tile:hover .tile__media img { transform: scale(1.1); }
    .tile__shade {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, transparent 50%, rgba(26,47,58,.28) 100%);
    }
    .tile__body { padding: .95rem 1rem 1.1rem; display: flex; flex-direction: column; gap: .35rem; flex: 1; }
    .tile__body h3 { margin: 0; font-size: 1.05rem; font-weight: 750; }
    .tile__body p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.7; flex: 1; }
    .tile__cta { margin-top: .35rem; font-size: 12.5px; font-weight: 700; color: var(--teal-deep); }
</style>
