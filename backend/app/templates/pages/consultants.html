{% extends "base.html" %}
{% block title %}مشاوران | کلینیک دلسا{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <h1 class="section__title">مشاوران کلینیک دلسا</h1>
    <div class="team-row team-row--wrap">
      {% for person in consultants %}
      <article class="team-card">
        <a href="/مشاور/{{ person.slug }}">
          {% if person.image_url %}<img src="{{ person.image_url }}" alt="{{ person.name }}">{% endif %}
          <h3>{{ person.name }}</h3>
          {% if person.role %}<p>{{ person.role }}</p>{% endif %}
        </a>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
